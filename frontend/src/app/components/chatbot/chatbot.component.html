<!-- Chat Button -->
<button class="chat-btn shadow-lg" (click)="toggleChat()" [ngClass]="{'d-none': isOpen}" id="chatbot-toggle-btn">
  <div class="chat-btn-inner">
    <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" fill="currentColor" viewBox="0 0 16 16">
      <path d="M16 8c0 3.866-3.582 7-8 7a9.06 9.06 0 0 1-2.347-.306c-2.013 3.712-3.821 3.399-3.821 3.399l.986-3.415C1.528 12.658 0 10.55 0 8c0-3.866 3.582-7 8-7s8 3.134 8 7zM5 8a1 1 0 1 0-2 0 1 1 0 0 0 2 0zm4 0a1 1 0 1 0-2 0 1 1 0 0 0 2 0zm3 1a1 1 0 1 0 0-2 1 1 0 0 0 0 2z"/>
    </svg>
  </div>
  <span class="chat-btn-pulse"></span>
</button>

<!-- Chat Window -->
<div class="chat-window" [ngClass]="{'show-chat': isOpen, 'hide-chat': !isOpen}" id="chatbot-window">
  
  <!-- Header -->
  <div class="chat-header">
    <div class="chat-header-left">
      <div class="bot-avatar-wrapper">
        <div class="bot-avatar">🤖</div>
        <span class="status-dot"></span>
      </div>
      <div class="bot-info">
        <h6 class="bot-name">VolunBot</h6>
        <span class="bot-status">{{ isTyping ? 'Escribiendo...' : 'En línea • IA RAG' }}</span>
      </div>
    </div>
    <div class="chat-header-actions">
      <button class="header-action-btn" (click)="clearChat()" title="Limpiar chat" id="chatbot-clear-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
          <path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0z"/>
          <path d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4zM2.5 3h11V2h-11z"/>
        </svg>
      </button>
      <button class="header-action-btn close-btn" (click)="toggleChat()" aria-label="Cerrar" id="chatbot-close-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
          <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Messages Body -->
  <div class="chat-body" #scrollMe [scrollTop]="scrollMe.scrollHeight" id="chatbot-messages">
    <div *ngFor="let msg of messages; let i = index" 
         class="message-wrapper" 
         [ngClass]="{'msg-user': msg.isUser, 'msg-bot': !msg.isUser}"
         [style.animation-delay]="(i * 0.05) + 's'">
      
      <!-- Bot Message -->
      <div *ngIf="!msg.isUser" class="message-row bot-row">
        <div class="msg-avatar">🤖</div>
        <div class="message-content">
          <div class="message-bubble bot-bubble">
            <div class="bot-text" [innerHTML]="msg.html"></div>
          </div>
          <span class="msg-time">{{ msg.time }}</span>
        </div>
      </div>
      
      <!-- User Message -->
      <div *ngIf="msg.isUser" class="message-row user-row">
        <div class="message-content">
          <div class="message-bubble user-bubble">
            <p class="user-text">{{ msg.text }}</p>
          </div>
          <span class="msg-time">{{ msg.time }}</span>
        </div>
      </div>
    </div>

    <!-- Typing Indicator -->
    <div *ngIf="isTyping" class="message-wrapper msg-bot">
      <div class="message-row bot-row">
        <div class="msg-avatar">🤖</div>
        <div class="message-content">
          <div class="message-bubble bot-bubble typing-bubble">
            <div class="typing-indicator">
              <span></span><span></span><span></span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Quick Suggestions (shown only when there are 1-2 messages) -->
    <div *ngIf="messages.length <= 1 && !isTyping" class="quick-suggestions">
      <p class="suggestions-title">💡 Preguntas sugeridas:</p>
      <div class="suggestions-grid">
        <button *ngFor="let suggestion of quickSuggestions" 
                class="suggestion-chip" 
                (click)="useSuggestion(suggestion)">
          {{ suggestion }}
        </button>
      </div>
    </div>
  </div>

  <!-- Input Area -->
  <div class="chat-footer" id="chatbot-input-area">
    <form (ngSubmit)="sendMessage()" class="input-row">
      <input 
        type="text" 
        class="chat-input" 
        placeholder="Pregúntame sobre VolunSys..." 
        [(ngModel)]="newMessage" 
        name="message" 
        autocomplete="off"
        id="chatbot-input"
        required>
      <button type="submit" class="send-btn" [disabled]="!newMessage.trim()" id="chatbot-send-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
          <path d="M15.964.686a.5.5 0 0 0-.65-.65L.767 5.855H.766l-.452.18a.5.5 0 0 0-.082.887l.41.26.001.002 4.995 3.178 3.178 4.995.002.002.26.41a.5.5 0 0 0 .886-.083zm-1.833 1.89L6.637 10.07l-.215-.338a.5.5 0 0 0-.154-.154l-.338-.215 7.494-7.494 1.178-.471z"/>
        </svg>
      </button>
    </form>
    <div class="footer-branding">
      Powered by <strong>RAG</strong> • Groq + HuggingFace + ChromaDB
    </div>
  </div>
</div>
