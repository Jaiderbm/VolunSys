<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm" style="background: linear-gradient(90deg, #1e3c72 0%, #2a5298 100%);">
  <div class="container d-flex justify-content-between align-items-center py-2">

    <a class="navbar-brand fw-bolder fs-4" routerLink="/">
      🌟 VolunSys
    </a>

    <div>
      <!-- VISTA AUTENTICADA (Solo fuera de Home) -->
      <ng-container *ngIf="rol && !isHome">
        <a class="btn btn-primary bg-opacity-10 shadow-sm rounded-pill px-3 me-3" style="border: 1px solid rgba(255,255,255,0.2);" routerLink="/dashboard">🏠 Dashboard</a>
        
        <!-- Botón Perfil (Todos los roles) -->
        <a class="btn btn-light rounded-pill px-3 me-3 text-primary fw-bold shadow-sm" routerLink="/perfil">👤 Perfil</a>
        
        <!-- Botón Mis Inscripciones (Solo Voluntarios) -->
        <a *ngIf="rol === 'User'" class="btn btn-light rounded-pill px-3 me-3 text-success fw-bold shadow-sm" routerLink="/inscripciones">✅ Mis Actividades</a>

        <!-- Dropdown Gestión (Admin / Organizador) -->
        <div *ngIf="rol === 'Admin' || rol === 'Coordinador'" class="dropdown d-inline-block me-3">
          <button class="btn btn-warning rounded-pill px-3 dropdown-toggle shadow-sm text-dark fw-bold" type="button" (click)="dropdownOpen = !dropdownOpen">
            🔧 Gestión
          </button>
          <ul class="dropdown-menu shadow" [class.show]="dropdownOpen" style="position: absolute; right: 0; z-index: 1050;">
            <li *ngIf="rol === 'Admin'"><a class="dropdown-item" routerLink="/usuarios" (click)="dropdownOpen = false">👥 Usuarios</a></li>
            <li><a class="dropdown-item" routerLink="/organizador/planificacion" (click)="dropdownOpen = false">📅 Planificar Jornada</a></li>
            <li><a class="dropdown-item" routerLink="/organizador/asignaciones" (click)="dropdownOpen = false">✍️ Asignar Tareas</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" routerLink="/powerbi" (click)="dropdownOpen = false">📊 Power BI</a></li>
          </ul>
        </div>

        <button class="btn btn-danger rounded-pill px-4 shadow fw-bold" (click)="logout()">
          🚪 Salir
        </button>
      </ng-container>

      <!-- VISTA AUTENTICADA EN HOME (Simplificada) -->
      <ng-container *ngIf="rol && isHome">
        <a class="btn btn-light rounded-pill px-4 shadow fw-bold text-primary me-3" routerLink="/dashboard">
          🚀 Ir al Dashboard
        </a>
        <button class="btn btn-outline-light rounded-pill px-4 shadow fw-bold" (click)="logout()">
          Salir
        </button>
      </ng-container>

      <!-- VISTA GUEST (LIMPIA) -->
      <ng-container *ngIf="!rol">
        <a class="btn btn-light rounded-pill px-4 shadow fw-bold text-primary" routerLink="/login">
          🔑 Iniciar Sesión
        </a>
      </ng-container>
    </div>

  </div>
</nav>
