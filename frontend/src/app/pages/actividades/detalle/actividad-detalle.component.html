<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold text-primary">Próximas Jornadas</h2>
    <a routerLink="/voluntariados" class="btn btn-outline-secondary rounded-pill">Volver</a>
  </div>

  <div *ngIf="loading" class="text-center my-5">
    <div class="spinner-border text-primary" role="status"></div>
  </div>

  <div *ngIf="error" class="alert alert-danger">{{error}}</div>

  <div *ngIf="!loading && !error && actividades.length === 0" class="text-center my-5 p-5 bg-white shadow-sm rounded-4">
    <h4 class="text-muted">No hay jornadas programadas para este programa aún.</h4>
  </div>

  <div *ngIf="!loading && !error && actividades.length > 0" class="row g-4">
    <div *ngFor="let act of actividades" class="col-md-6">
      <div class="card h-100 border-0 shadow-sm rounded-4 overflow-hidden">
        <div class="row g-0">
          <div class="col-4 bg-info bg-opacity-10 d-flex align-items-center justify-content-center">
            <span class="fs-1">🗓️</span>
          </div>
          <div class="col-8">
            <div class="card-body">
              <h5 class="card-title fw-bold">{{act.titulo}}</h5>
              <p class="card-text text-muted small mb-2">
                {{act.descripcion || 'Sin descripción'}}
              </p>
              <div class="d-flex flex-wrap gap-2 mb-3">
                <span class="badge bg-light text-dark border">📅 {{act.fecha}}</span>
                <span class="badge bg-light text-dark border">⏰ {{act.hora}}</span>
                <span class="badge bg-light text-dark border">👥 Cupos: {{act.cupos}}</span>
              </div>

              <div *ngIf="getInscripcionForAct(act.id) as ins; else notInscribed">
                <button *ngIf="ins.estado === 'Completado' || ins.estado === 'Confirmada'; else showConfirm" class="btn btn-success w-100 rounded-pill fw-bold disabled">
                  ✅ Asistencia Confirmada
                </button>
                <ng-template #showConfirm>
                  <button class="btn btn-warning w-100 rounded-pill fw-bold" (click)="confirmar(ins.id)">
                    Confirmar Asistencia
                  </button>
                </ng-template>
              </div>
              <ng-template #notInscribed>
                <button class="btn btn-primary w-100 rounded-pill fw-bold" (click)="inscribirse(act.id)">
                  Inscribirse a la Jornada
                </button>
              </ng-template>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
