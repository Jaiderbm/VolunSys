<div class="register-container mt-2">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-6 col-md-8">
        <div class="glass-panel p-5">
          <div class="text-center mb-4">
            <h2 class="fw-bolder text-dark mb-2" style="background: linear-gradient(45deg, #f12711, #f5af19); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Únete al Cambio</h2>
            <p class="text-muted fw-medium">Regístrate como Voluntario de VolunSys</p>
          </div>

          <div *ngIf="error" class="alert alert-danger py-2 small fw-bold text-center border-0 shadow-sm rounded-pill">{{error}}</div>
          <div *ngIf="exito" class="alert alert-success py-2 small fw-bold text-center border-0 shadow-sm rounded-pill mt-3">{{exito}}</div>

          <form (ngSubmit)="handleRegister()">
            <div class="row g-3 mb-3">
              <div class="col-md-6 form-floating">
                <input type="text" class="form-control rounded-3 bg-light" id="nombre" [(ngModel)]="form.nombre" name="nombre" placeholder="Juan" required>
                <label for="nombre" class="ms-2 text-muted">Nombre</label>
              </div>
              <div class="col-md-6 form-floating">
                <input type="text" class="form-control rounded-3 bg-light" id="apellido" [(ngModel)]="form.apellido" name="apellido" placeholder="Pérez" required>
                <label for="apellido" class="ms-2 text-muted">Apellido</label>
              </div>
            </div>

            <div class="form-floating mb-3">
              <input type="text" class="form-control rounded-3 bg-light" id="numero_documento" [(ngModel)]="form.numero_documento" name="numero_documento" placeholder="123456789" required>
              <label for="numero_documento" class="text-muted">Número de Documento (Requerido)</label>
            </div>

            <div class="form-floating mb-3">
              <input type="email" class="form-control rounded-3 bg-light" id="email" [(ngModel)]="form.email" name="email" placeholder="correo@ejemplo.com" required>
              <label for="email" class="text-muted">Correo electrónico</label>
            </div>

            <div class="form-floating mb-3">
              <input type="tel" class="form-control rounded-3 bg-light" id="telefono" [(ngModel)]="form.telefono" name="telefono" placeholder="3000000000">
              <label for="telefono" class="text-muted">Teléfono (opcional)</label>
            </div>

            <div class="form-floating mb-4">
              <input type="password" class="form-control rounded-3 bg-light" id="password" [(ngModel)]="form.password" name="password" placeholder="Clave secreta" required>
              <label for="password" class="text-muted">Contraseña (Mín. 8 letras, 1 Número, 1 Mayúscula)</label>
            </div>

            <p class="small text-muted text-center mb-4">🎵 Nota: Al registrarte, tu rol por defecto será estrictamente <b>Voluntario</b>.</p>

            <button type="submit" class="btn btn-warning w-100 py-3 rounded-pill fw-bold shadow-sm" style="background: linear-gradient(45deg, #f12711, #f5af19); border: none; color: white; font-size: 1.1rem;">
              Crear Cuenta Oficial
            </button>
          </form>

          <div class="text-center mt-4 pt-2 border-top">
            <span class="text-muted small">¿Ya eres voluntario? <a routerLink="/login" class="text-primary fw-bold text-decoration-none">Inicia Sesión aquí</a></span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
